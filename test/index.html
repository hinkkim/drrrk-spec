*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {

#app {

/* ── SCREEN BASE ── */
.screen {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.screen.active {
  opacity: 1;
  pointer-events: all;
}

/* ── FULL-SCREEN IMAGE ── */
.fs-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}

/* ══════════════════════════════

══════════════════════════════ */
#screen-intro {
  background: #ffffff;
}

/* ── golden ambient blobs ── */
.intro-blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(80px);
  opacity: 0.65;
  width: 444px; height: 444px;
}
.intro-blob-1 {
  background: radial-gradient(circle, #FDE6A3 0%, #FFD6B6 100%);
  left: -138px; top: 200px;
}
.intro-blob-2 {
  background: radial-gradient(circle, #FFE8A3 0%, #FFD6B6 100%);

  left:  73px; top: 316px;
}

/* ── tag "자산 감수성 테스트" ── */
.intro-tag {
  position: absolute;
  top: 194px;
  left: 50%; transform: translateX(-50%);
  font-size: 12px; font-weight: 700;
  color: #f5be28;
  background: rgba(245, 190, 40, 0.08);
  border: 1px solid rgba(245, 190, 40, 0.45);
  padding: 5px 16px; border-radius: 20px;
  white-space: nowrap; letter-spacing: 0.06em;
  z-index: 1;
}

/* ── main title ── */
.intro-title {
  position: absolute;
  top: 228px;
  left: 0; right: 0;
  text-align: center;
  font-family: 'Black Han Sans', 'SBAggroOTF', 'Noto Sans KR', sans-serif;
  font-size: 28px; font-weight: 900;
  color: #1a1209;
  line-height: 1.45;
  letter-spacing: -0.02em;
  z-index: 1;
}

/* ── scan frame area (Figma: left=105, top=386, w=184.565, h=169) ── */
.scan-area {
  position: absolute;
  left: 105px; top: 386px;
  width: 184.565px; height: 169px;
  z-index: 2;
}
.scan-corners {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.scan-line {
  position: absolute;
  left: 6px; right: 6px; height: 2px;
  background: linear-gradient(90deg, transparent, #01C65C 20%, #01C65C 80%, transparent);
  border-radius: 2px;
  box-shadow: 0 0 8px rgba(1,198,92,0.9), 0 0 18px rgba(1,198,92,0.35);
  top: 12%; opacity: 0;    /* hidden by default — JS activates it */
  animation: none;
}
@keyframes scan-move {
  0%   { top: 12%; opacity: 0; }
  6%   { opacity: 1; }
  50%  { top: 80%; opacity: 1; }
  60%  { top: 82%; opacity: 0; }
  100% { top: 82%; opacity: 0; }
}
/* Face perspective container — perspective on parent enables child rotateY depth */
#face-persp {
  position: absolute;
  left: 26px; top: 8px;
  width: 133px; height: 133px;
  perspective: 500px;
  perspective-origin: 50% 50%;
}
#face-img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}
/* 350° Y-axis spin (applied to #face-img via JS) */
@keyframes face-spin-350 {
  from { transform: rotateY(0deg); }
  to   { transform: rotateY(350deg); }
}

/* ── floating items (absolute on #screen-intro) ── */
.intro-gold-bars {
  position: absolute;
  left: -11px; top: 339px;
  width: 125px;
  z-index: 3;
}
.intro-laptop {
  position: absolute;
  left: 295px; top: 348px;
  width: 78px;
  z-index: 3;
}
.intro-ring-box {
  position: absolute;
  left: 17px; top: 485px;
  width: 80px;
  transform: rotate(-10.18deg);
  z-index: 3;
}
.intro-watch {
  position: absolute;
  left: 288px; top: 471px;
  width: 78px;
  z-index: 3;
}

/* ── decorative particles ── */
.intro-particles {
  position: absolute;
  left: 65px; top: 582px;
  width: 244px; height: 112px;
  pointer-events: none;
  z-index: 1;
}

/* ── subtitle ── */

  position: absolute;
  top: 613px;
  left: 0; right: 0;
  text-align: center;

  color: #8a7860;
  letter-spacing: -0.01em;
  z-index: 1;
}

  left: 50%; transform: translateX(-50%);
  top: 662px;
  width: min(346px, 88%); height: 55px;

  font-size: 17px; font-weight: 700;
  color: #1a1209;
  cursor: pointer;
  letter-spacing: -0.01em;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.1s;
  z-index: 2;
}
.intro-start-btn:active {
  transform: translateX(-50%) scale(0.97);
  background: #e6ad1a;

/* ── logo (Figma: left=152, top=745) ── */
.intro-logo {

  z-index: 1;

/* ══════════════════════════════
   LOADING
══════════════════════════════ */
#screen-loading {
  background: #FFF9EB;
}
#loading-img {
  transition: opacity 0.2s ease;
}

/* ══════════════════════════════
   QUESTION — full image + transparent overlays
══════════════════════════════ */
#screen-question {
  background: #fff;
}

/*
  Transparent overlay buttons positioned over
  the option and 다음 areas in the question images.

  All question images use a consistent template:
  Options measured from BOTTOM of screen (852px base):
    Opt 0 — bottom: 54.6%, height: 6.1%
    Opt 1 — bottom: 47.0%, height: 6.1%
    Opt 2 — bottom: 39.3%, height: 6.1%
    Opt 3 — bottom: 31.7%, height: 6.1%
    다음   — bottom: 20.2%, height: 7.6%
*/
.q-opt-overlay {
  position: absolute;
  left: 8%;
  width: 84%;
  height: 6.1%;
  background: transparent;
  border: 2px solid transparent;
  border-radius: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.q-opt-overlay[data-i="0"] { bottom: 54.6%; }
.q-opt-overlay[data-i="1"] { bottom: 47.0%; }
.q-opt-overlay[data-i="2"] { bottom: 39.3%; }
.q-opt-overlay[data-i="3"] { bottom: 31.7%; }

.q-opt-overlay.selected {
  background: rgba(255, 193, 31, 0.22);
  border-color: #FFC11F;
}

.q-next-overlay {
  position: absolute;
  left: 8%;
  width: 84%;
  bottom: 20.2%;
  height: 7.6%;
  background: transparent;
  border: none;
  cursor: pointer;
  border-radius: 14px;
  -webkit-tap-highlight-color: transparent;
}
.q-next-overlay.shake {
  animation: shake 0.35s ease;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-7px); }
  40%      { transform: translateX(7px); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}

/* ══════════════════════════════
   RESULT
══════════════════════════════ */
#screen-result {

}

#result-card-layer {

  right: 0;

.toast.show {

</style>

  { min: 70, img: 'images/유형2.png', name: '부자 DNA 잠금해제 직전',       cta: '장롱 속 자산 확인하기' },
  { min: 50, img: 'images/유형3.png', name: '머리는 부자, 손발은 대기 중',  cta: '검색 말고 실제 견적 받아보기' },
  { min: 30, img: 'images/유형4.png', name: '옷장엔 있는데 통장엔 없음',    cta: '장롱 속 돈 찾아보기' },
  { min: 0,  img: 'images/유형5.png', name: '욜로 인생 만렙형',             cta: '미래의 나 구하러 가기' }
];

const LOADING_IMGS = ['images/로딩.png','images/로딩2.png','images/로딩3.png','images/로딩4.png'];

/* ────────── STATE ────────── */
let currentQ    = 0;
let answers     = [];
let selectedOpt = null;
let pendingPct  = null;


/* ────────── INTRO ANIMATION ──────────
   Sequence (loop, ~5.5s/cycle):
   1. 표지1 — right-profile face, scan hidden  (1.2s hold)
   2. SPIN  — rotateY(350°) over 1.2s; swap face at ~300ms (90° mark)
   3. 표지2 — front face, scan sweeps top→bottom  (2.0s)
   4. 표지3 — left-profile face, scan fades out   (0.9s)
──────────────────────────────────────── */
let introRunning = false;

function startIntroAnim() {
  introRunning = true;
  runIntroLoop();
}

function stopIntroAnim() {
  introRunning = false;
}

/* Utility: promisified delay that respects introRunning */
function iDelay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function runIntroLoop() {
  const faceImg  = document.getElementById('face-img');
  const facePersp = document.getElementById('face-persp');
  const scanLine = document.getElementById('scan-line');

  /* Helper: restart scan sweep animation */
  function activateScan() {
    scanLine.style.animation = 'none';
    scanLine.offsetHeight; // force reflow
    scanLine.style.animation = 'scan-move 1.8s ease-in-out 1 forwards';
  }
  function deactivateScan() {
    scanLine.style.animation = 'none';
    scanLine.style.opacity = '0';
  }
  /* Helper: reset face to un-rotated, change image + size */
  function setFace(src, w, h) {
    faceImg.style.animation = 'none';
    faceImg.style.transform = '';
    faceImg.src = src;
    facePersp.style.width  = w + 'px';
    facePersp.style.height = h + 'px';
    // Adjust left so face stays centered in the ~184px-wide scan frame
    facePersp.style.left = Math.round((184.565 - w) / 2) + 'px';
  }

  while (introRunning) {
    /* ── Phase 1: right-profile face (표지1) ── */
    setFace('images/figma_face_single.png', 129, 131);
    deactivateScan();
    await iDelay(1200);
    if (!introRunning) break;

    /* ── Phase 2: 350° spin to the right ── */
    faceImg.offsetHeight; // reflow before starting animation
    faceImg.style.animation = 'face-spin-350 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards';

    // At ~90° mark (~300ms in), swap to front face while edge-on
    await iDelay(300);
    if (!introRunning) break;
    faceImg.src = 'images/figma_face2.png';
    facePersp.style.width  = '133px';
    facePersp.style.height = '119px';
    facePersp.style.left   = Math.round((184.565 - 133) / 2) + 'px';

    // Wait for rest of spin
    await iDelay(900);
    if (!introRunning) break;

    /* ── Phase 3: front face (표지2) + scan sweep ── */
    faceImg.style.animation = 'none';
    faceImg.style.transform = '';       // snap to un-rotated
    activateScan();

    await iDelay(2000);
    if (!introRunning) break;

    /* ── Phase 4: left-profile face (표지3), scan fades ── */
    faceImg.src = 'images/figma_face3.png';
    facePersp.style.width  = '136px';
    facePersp.style.height = '131px';
    facePersp.style.left   = Math.round((184.565 - 136) / 2) + 'px';
    deactivateScan();

    await iDelay(900);
  }
}

/* ────────── SCREEN ────────── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ────────── LOADING ────────── */
function showLoading(duration, callback) {
  showScreen('screen-loading');
  const el  = document.getElementById('loading-img');
  const step = Math.max(220, Math.floor(duration / LOADING_IMGS.length));
  let i = 1;

  el.src     = LOADING_IMGS[0];
  el.style.opacity = '1';

  const iv = setInterval(() => {
    el.style.opacity = '0';
    setTimeout(() => {
      el.src = LOADING_IMGS[i % LOADING_IMGS.length];
      el.style.opacity = '1';
      i++;
    }, 180);
  }, step);

  setTimeout(() => { clearInterval(iv); callback(); }, duration);
}

/* ────────── START ────────── */
function startTest() {
  stopIntroAnim();
  answers = []; currentQ = 0; selectedOpt = null; pendingPct = null;
  showLoading(900, () => renderQuestion(0));
}

/* ────────── QUESTION ────────── */
function renderQuestion(index) {
  selectedOpt = null;
  // Clear any previous selection highlight
  document.querySelectorAll('.q-opt-overlay').forEach(b => b.classList.remove('selected'));
  // Swap the background image to the matching question design
  document.getElementById('q-bg-img').src = `images/질문${index + 1}.png`;
  showScreen('screen-question');
}

function selectOpt(i) {
  selectedOpt = i;
  document.querySelectorAll('.q-opt-overlay').forEach((b, j) =>
    b.classList.toggle('selected', j === i)
  );
}

function nextQuestion() {
  if (selectedOpt === null) {
    const btn = document.getElementById('btn-next');
    btn.classList.remove('shake');
    void btn.offsetHeight; // reflow to restart animation
    btn.classList.add('shake');
    showToast('먼저 하나 골라봐! 👆');
    return;
  }

  answers.push(QUESTIONS[currentQ].opts[selectedOpt].s);

  if (currentQ < QUESTIONS.length - 1) {
    currentQ++;
    renderQuestion(currentQ);
  } else {
    const total = answers.reduce((a, b) => a + b, 0);
    const pct   = Math.round((total / 80) * 100);
    pendingPct  = pct;
    showLoading(1400, () => showResult(pct));
  }
}

/* ────────── RESULT ────────── */
function getGrade(pct) { return GRADES.find(g => pct >= g.min); }

function showResult(pct) {
  const grade = getGrade(pct);

  document.getElementById('result-type-img').src        = grade.img;
  document.getElementById('result-cta-text').textContent = grade.cta;

  // Animated count-up for score
  const el  = document.getElementById('rc-pct');
  let count = 0;
  const inc   = pct / 40;
  const timer = setInterval(() => {
    count = Math.min(count + inc, pct);
    el.textContent = Math.round(count);
    if (count >= pct) clearInterval(timer);
  }, 1200 / 40);

  showScreen('screen-result');
}

/* ────────── SAVE (html2canvas) ────────── */
function saveCard() {
  showToast('저장 준비 중...');
  html2canvas(document.getElementById('result-card-layer'), {
    scale:           2,
    useCORS:         true,
    allowTaint:      true,
    logging:         false,
    backgroundColor: null
  }).then(canvas => {
    const a      = document.createElement('a');
    a.download   = 'drrrk_부자될상.png';
    a.href       = canvas.toDataURL('image/png');
    a.click();
    showToast('카드 저장 완료! 📷');
  }).catch(() => showToast('저장 실패. 스크린샷으로 저장해봐!'));
}

/* ────────── SHARE ────────── */
function shareLink() {
  const pct   = pendingPct ?? (parseInt(document.getElementById('rc-pct').textContent) || 0);
  const grade = getGrade(pct);
  const url   = `${location.origin}${location.pathname}?score=${pct}`;
  const text  = `나 부자 될 상 테스트 해봤는데 ${pct}%나 나옴 😳 (${grade.name}) 너도 해봐`;

  if (navigator.share) {
    navigator.share({ title: '내가 부자가 될 상인가?', text, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(`${text}\n${url}`)
      .then(() => showToast('링크 복사 완료! 🔗'))
      .catch(() => showToast('링크 복사 실패'));
  }
}

/* ────────── RESTART ────────── */
function restartTest() {
  pendingPct = null;
  showScreen('screen-intro');
  startIntroAnim();
}

/* ────────── TOAST ────────── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

/* ────────── INIT / DEEP-LINK ────────── */
document.addEventListener('DOMContentLoaded', () => {
  const sp = new URLSearchParams(location.search).get('score');
  if (sp !== null) {
    const pct = Math.min(100, Math.max(0, parseInt(sp) || 0));
    pendingPct = pct;
    showResult(pct);
  } else {
    showScreen('screen-intro');
    startIntroAnim();
  }
});
</script>
